# Poll the Pogoh station API every 5 minutes and commit the result to the
# `data` branch as one gzipped JSON file per poll (see src/pogoh/raw.py).
#
# - Runs at minutes 2, 7, 12, ... instead of 0, 5, 10, because GitHub says
#   scheduled runs are most often delayed at the top of the hour.
# - GitHub may still delay or drop some runs. The poll time inside each file
#   is the real fetch time, so delays show up honestly in the data.
# - Only one run at a time; a queued run waits instead of overlapping.
# - "Run workflow" on the Actions tab triggers a poll by hand.

name: Collect Pogoh snapshot

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # needed to push to the data branch

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  poll:
    # Pinned so GitHub's switch of ubuntu-latest to a new release
    # (from 2026-10-19) cannot change the environment mid-collection.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out code (main)
        uses: actions/checkout@v7

      - name: Check out data branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: store

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet "requests>=2.31"

      - name: Poll once
        run: python scripts/poll_to_file.py --out store

      - name: Commit and push the new record
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw
          git commit --quiet -m "Add poll record"
          # Each file has a unique name, so a rebase never conflicts.
          for attempt in 1 2 3; do
            if git push --quiet origin HEAD:data; then exit 0; fi
            sleep 5
            git pull --quiet --rebase origin data
          done
          exit 1
